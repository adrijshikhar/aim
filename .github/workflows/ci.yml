name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      use_actr:
        description: 'Run macOS tests on self-hosted actr runner'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.platform }})
    timeout-minutes: 25
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-latest

          # Public fork PRs run safely on GitHub-hosted macos-latest to prevent arbitrary host code execution.
          # Trusted repository PRs, main pushes, or manual dispatches run on self-hosted actr.
          - platform: macOS
            runner: ${{ (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && inputs.use_actr)) && fromJSON('["self-hosted", "macOS"]') || 'macos-latest' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify Formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Unformatted Go code found:"
            gofmt -l .
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: Run Tests (Race Detector)
        run: go test -v -race ./...

      - name: Run Integration Smoke Tests
        run: ./test/smoke_test.sh

      - name: Run Live CLI Tests
        run: bash ./test/live_cli_test.sh

      - name: Run Live E2E Tests
        run: bash ./test/e2e_live_test.sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Frontend Dependencies
        working-directory: web
        run: pnpm install

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run Web Dashboard E2E Tests
        working-directory: web
        env:
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
          TINKER_API_BASE_URL: ${{ secrets.TINKER_API_BASE_URL }}
        run: |
          if [ -z "$TINKER_API_KEY" ]; then
            echo "::warning::TINKER_API_KEY is unset (e.g. fork PR). Skipping live agent E2E tests."
          else
            pnpm test:e2e
          fi
