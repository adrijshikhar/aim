name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify Formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Unformatted Go code found:"
            gofmt -l .
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: Run Tests (Race Detector)
        run: go test -v -race ./...

      - name: Run Integration Smoke Tests
        run: ./test/smoke_test.sh

      - name: Run Live CLI Tests
        run: bash ./test/live_cli_test.sh

      - name: Run Live E2E Tests
        run: bash ./test/e2e_live_test.sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Frontend Dependencies
        working-directory: web
        run: pnpm install

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run Web Dashboard E2E Tests
        working-directory: web
        env:
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
          TINKER_API_BASE_URL: ${{ secrets.TINKER_API_BASE_URL }}
        run: pnpm test:e2e

