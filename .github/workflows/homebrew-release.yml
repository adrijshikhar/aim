name: Update Homebrew Tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to verify and publish to tap (e.g. v0.1.1)'
        required: true
        default: 'v0.1.1'

permissions:
  contents: read

jobs:
  verify-asset:
    name: Verify Release Asset & Checksum
    runs-on: macos-latest
    outputs:
      tag: ${{ steps.checksum.outputs.tag }}
      version: ${{ steps.checksum.outputs.version }}
      sha_darwin_arm64: ${{ steps.checksum.outputs.sha_darwin_arm64 }}
      sha_darwin_amd64: ${{ steps.checksum.outputs.sha_darwin_amd64 }}
      sha_linux_arm64: ${{ steps.checksum.outputs.sha_linux_arm64 }}
      sha_linux_amd64: ${{ steps.checksum.outputs.sha_linux_amd64 }}
    steps:
      - name: Determine Version & Check Release Availability
        id: checksum
        run: |
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            echo "Error: No release tag provided" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          BASE_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          CHECKSUMS_URL="${BASE_URL}/checksums.txt"

          echo "Checking release assets availability at: $CHECKSUMS_URL"
          FOUND=false
          for i in {1..15}; do
            HTTP_CODE=$(curl -sL -w "%{http_code}" -o checksums.txt "$CHECKSUMS_URL" || true)
            if [ "$HTTP_CODE" = "200" ] && [ -s checksums.txt ]; then
              echo "Release assets live and checksums.txt successfully retrieved!"
              FOUND=true
              break
            fi
            echo "Attempt $i/15: waiting for release assets to propagate (HTTP $HTTP_CODE)..."
            sleep 5
          done

          if [ "$FOUND" = "false" ]; then
            echo "Error: Release assets failed to become available after 75s" >&2
            exit 1
          fi

          PLATFORMS=("darwin_arm64" "darwin_amd64" "linux_arm64" "linux_amd64")
          for PLATFORM in "${PLATFORMS[@]}"; do
            ARCHIVE="aim_${VERSION}_${PLATFORM}.tar.gz"
            echo "Downloading and verifying $ARCHIVE..."
            curl -fSL -o "$ARCHIVE" "${BASE_URL}/${ARCHIVE}"

            COMPUTED_SHA=$(shasum -a 256 "$ARCHIVE" | awk '{print $1}')
            EXPECTED_SHA=$(grep "$ARCHIVE" checksums.txt | awk '{print $1}')

            if [ -z "$EXPECTED_SHA" ]; then
              echo "Error: No checksum found in checksums.txt for $ARCHIVE" >&2
              exit 1
            fi

            if [ "$COMPUTED_SHA" != "$EXPECTED_SHA" ]; then
              echo "Error: Checksum mismatch for $ARCHIVE!" >&2
              echo "  Computed: $COMPUTED_SHA" >&2
              echo "  Expected: $EXPECTED_SHA" >&2
              exit 1
            fi

            echo "✓ Verified $ARCHIVE ($COMPUTED_SHA)"
            echo "sha_${PLATFORM}=$COMPUTED_SHA" >> "$GITHUB_OUTPUT"
          done

      - name: Run Binary Smoke Test Probe
        run: |
          TAG="${{ steps.checksum.outputs.tag }}"
          VERSION="${{ steps.checksum.outputs.version }}"

          echo "Extracting binary to run pre-flight smoke test..."
          RUNNER_ARCH="$(uname -m)"
          if [ "$RUNNER_ARCH" = "arm64" ]; then
            tar -xzf "aim_${VERSION}_darwin_arm64.tar.gz" aim
          else
            tar -xzf "aim_${VERSION}_darwin_amd64.tar.gz" aim
          fi

          chmod +x ./aim
          PROBE_VERSION=$(./aim -v)
          echo "Probe version output: $PROBE_VERSION"

          if [[ "$PROBE_VERSION" != *"aim version ${VERSION}"* ]]; then
            echo "Error: Pre-flight smoke test failed. Expected version ${VERSION}, got: $PROBE_VERSION" >&2
            exit 1
          fi
          echo "✓ Binary probe verification PASSED: $PROBE_VERSION"

  update-tap:
    name: Gated Tap Update & Brew Audit
    needs: verify-asset
    runs-on: macos-latest
    environment: homebrew # Maintainer Approval Gate
    steps:
      - name: Checkout Homebrew Tap
        uses: actions/checkout@v4
        with:
          repository: 'adrijshikhar/homebrew-tap'
          token: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: tap

      - name: Update Cask Definition
        run: |
          VERSION="${{ needs.verify-asset.outputs.version }}"
          SHA_DARWIN_ARM64="${{ needs.verify-asset.outputs.sha_darwin_arm64 }}"
          SHA_DARWIN_AMD64="${{ needs.verify-asset.outputs.sha_darwin_amd64 }}"
          SHA_LINUX_ARM64="${{ needs.verify-asset.outputs.sha_linux_arm64 }}"
          SHA_LINUX_AMD64="${{ needs.verify-asset.outputs.sha_linux_amd64 }}"

          CASK_PATH="tap/Casks/aim.rb"
          mkdir -p tap/Casks

          cat << EOF > "$CASK_PATH"
          # This file was generated by the owner-gated release pipeline.
          cask "aim" do
            version "${VERSION}"

            on_macos do
              on_arm do
                sha256 "${SHA_DARWIN_ARM64}"
                url "https://github.com/adrijshikhar/aim/releases/download/v#{version}/aim_#{version}_darwin_arm64.tar.gz"
              end
              on_intel do
                sha256 "${SHA_DARWIN_AMD64}"
                url "https://github.com/adrijshikhar/aim/releases/download/v#{version}/aim_#{version}_darwin_amd64.tar.gz"
              end
            end
            on_linux do
              on_arm do
                sha256 "${SHA_LINUX_ARM64}"
                url "https://github.com/adrijshikhar/aim/releases/download/v#{version}/aim_#{version}_linux_arm64.tar.gz"
              end
              on_intel do
                sha256 "${SHA_LINUX_AMD64}"
                url "https://github.com/adrijshikhar/aim/releases/download/v#{version}/aim_#{version}_linux_amd64.tar.gz"
              end
            end

            name "aim"
            desc "Isolated Profile Manager for AI Agents (Antigravity, Claude Code, Codex, Gemini)"
            homepage "https://github.com/adrijshikhar/aim"

            livecheck do
              skip "Auto-generated on release."
            end

            binary "aim"

            postflight do
              if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
                system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/aim"]
              end
            end
          end
          EOF

          # Ensure clean diff
          git -C tap diff Casks/aim.rb

      - name: Run Brew Audit
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          brew tap adrijshikhar/tap "$PWD/tap" --force 2>/dev/null || true
          brew audit --cask --strict --online adrijshikhar/tap/aim
          brew developer off 2>/dev/null || true

      - name: Test Brew Install
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          brew install --cask --force adrijshikhar/tap/aim
          aim -v

      - name: Commit and Push to Tap
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/aim.rb
          if git diff --cached --quiet; then
            echo "No changes detected in tap definition, skipping push."
          else
            git commit -m "feat(aim): update to ${{ needs.verify-asset.outputs.version }} (verified & audited)"
            git push origin main
          fi
