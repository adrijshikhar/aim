<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { background: #000; color: #fff; font-family: -apple-system, sans-serif; padding: 40px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; max-width: 1200px; margin: 0 auto; }
  .card { background: #0a0a0a; border: 1px solid #222; border-radius: 8px; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
  .preview { width: 100px; height: 100px; background: #000; border: 1px solid #1a1a1a; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
  .scales { display: flex; gap: 16px; align-items: center; }
  h3 { font-size: 14px; margin: 0; color: #ededed; }
  p { font-size: 11px; color: #777; margin: 0; }
</style>
</head>
<body>
<div class="grid">

  <!-- 1. The Monolithic Solid Prism -->
  <div class="card">
    <h3>1. Solid Prism (Refraction Split)</h3>
    <p>Solid faceted wedge with split spectrum</p>
    <div class="preview">
      <svg width="68" height="68" viewBox="0 0 24 24" fill="none">
        <!-- Left dark facet -->
        <path d="M12 2L3 19H12V2Z" fill="#888888"/>
        <!-- Right bright facet with cutout refraction slits -->
        <path d="M12 2L21 19H12V2Z" fill="#ededed"/>
        <!-- 3 Refracted horizontal slice bands -->
        <path d="M12 11H21M12 14.5H21M12 18H21" stroke="#000" stroke-width="1.4"/>
        <!-- Laser core point -->
        <circle cx="12" cy="7" r="1.5" fill="#00f0ff"/>
      </svg>
    </div>
    <div class="scales">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M12 2L3 19H12V2Z" fill="#888888"/><path d="M12 2L21 19H12V2Z" fill="#ededed"/><path d="M12 11H21M12 14.5H21M12 18H21" stroke="#000" stroke-width="1.4"/><circle cx="12" cy="7" r="1.5" fill="#00f0ff"/></svg>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 2L3 19H12V2Z" fill="#888888"/><path d="M12 2L21 19H12V2Z" fill="#ededed"/><path d="M12 12H21M12 16H21" stroke="#000" stroke-width="1.5"/></svg>
    </div>
  </div>

  <!-- 2. The Optical Apex (Prism Beam) -->
  <div class="card">
    <h3>2. Optical Beam Prism</h3>
    <p>Light beam penetrating crystal</p>
    <div class="preview">
      <svg width="68" height="68" viewBox="0 0 24 24" fill="none">
        <polygon points="12,3 21,19 3,19" fill="#141414" stroke="#ededed" stroke-width="1.7" stroke-linejoin="round"/>
        <!-- Entering ray -->
        <path d="M2 13L8 13.5" stroke="#ededed" stroke-width="1.8" stroke-linecap="round"/>
        <!-- Internal Refraction -->
        <path d="M8 13.5L14 15.5" stroke="#ededed" stroke-width="1.8" stroke-opacity="0.6"/>
        <!-- Spectral exit fan -->
        <path d="M14 15.5L22 13M14 15.5L22 16.5M14 15.5L22 20" stroke="#00f0ff" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="scales">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><polygon points="12,3 21,19 3,19" fill="#141414" stroke="#ededed" stroke-width="1.7" stroke-linejoin="round"/><path d="M2 13L8 13.5" stroke="#ededed" stroke-width="1.8" stroke-linecap="round"/><path d="M14 15.5L22 13M14 15.5L22 16.5M14 15.5L22 20" stroke="#00f0ff" stroke-width="1.6" stroke-linecap="round"/></svg>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><polygon points="12,3 21,19 3,19" stroke="#ededed" stroke-width="2"/><path d="M2 13L8 13.5M14 15.5L22 14M14 15.5L22 18" stroke="#ededed" stroke-width="1.5"/></svg>
    </div>
  </div>

  <!-- 3. The Linear Compass Arc -->
  <div class="card">
    <h3>3. Linear Compass Arc</h3>
    <p>Precision 90° Navigational Arc & Arrow</p>
    <div class="preview">
      <svg width="68" height="68" viewBox="0 0 24 24" fill="none">
        <!-- 90-degree Compass Arc -->
        <path d="M4 20A16 16 0 0 1 20 4" stroke="#ededed" stroke-width="1.75" stroke-linecap="round"/>
        <!-- Vector Pointer pointing Northeast -->
        <path d="M12 4H20V12" stroke="#ededed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="8" y1="16" x2="19" y2="5" stroke="#00f0ff" stroke-width="1.75" stroke-linecap="round"/>
        <circle cx="8" cy="16" r="2" fill="#00f0ff"/>
      </svg>
    </div>
    <div class="scales">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M4 20A16 16 0 0 1 20 4" stroke="#ededed" stroke-width="1.75" stroke-linecap="round"/><path d="M12 4H20V12" stroke="#ededed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="8" y1="16" x2="19" y2="5" stroke="#00f0ff" stroke-width="1.75" stroke-linecap="round"/><circle cx="8" cy="16" r="2" fill="#00f0ff"/></svg>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 20A16 16 0 0 1 20 4" stroke="#ededed" stroke-width="2" stroke-linecap="round"/><path d="M13 4H20V11" stroke="#ededed" stroke-width="2.2" stroke-linecap="round"/><line x1="8" y1="16" x2="19" y2="5" stroke="#ededed" stroke-width="2" stroke-linecap="round"/></svg>
    </div>
  </div>

  <!-- 4. The Astroid Compass Spark -->
  <div class="card">
    <h3>4. Polaris Astroid Star</h3>
    <p>Pure mathematical hypocycloid spark</p>
    <div class="preview">
      <svg width="68" height="68" viewBox="0 0 24 24" fill="none">
        <path d="M12 1.5C12 7.5 7.5 12 1.5 12C7.5 12 12 16.5 12 22.5C12 16.5 16.5 12 22.5 12C16.5 12 12 7.5 12 1.5Z" fill="#ededed"/>
        <circle cx="12" cy="12" r="2.2" fill="#000"/>
      </svg>
    </div>
    <div class="scales">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M12 1.5C12 7.5 7.5 12 1.5 12C7.5 12 12 16.5 12 22.5C12 16.5 16.5 12 22.5 12C16.5 12 12 7.5 12 1.5Z" fill="#ededed"/><circle cx="12" cy="12" r="2.2" fill="#000"/></svg>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 1.5C12 7.5 7.5 12 1.5 12C7.5 12 12 16.5 12 22.5C12 16.5 16.5 12 22.5 12C16.5 12 12 7.5 12 1.5Z" fill="#ededed"/></svg>
    </div>
  </div>

</div>
</body>
</html>
