<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { background: #000; color: #fff; font-family: -apple-system, sans-serif; padding: 40px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; max-width: 1200px; margin: 0 auto; }
  .card { background: #0a0a0a; border: 1px solid #222; border-radius: 8px; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
  .preview { width: 100px; height: 100px; background: #000; border: 1px solid #1a1a1a; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
  .scales { display: flex; gap: 16px; align-items: center; }
  h3 { font-size: 14px; margin: 0; color: #ededed; }
  p { font-size: 11px; color: #777; margin: 0; }
</style>
</head>
<body>
<div class="grid">

  <!-- 1. Refraction Prism -->
  <div class="card">
    <h3>1. Optical Prism (Light Split)</h3>
    <p>Direction 2: Refraction of Developer Intent</p>
    <div class="preview">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none">
        <path d="M10 3L19 19H1L10 3Z" stroke="#ededed" stroke-width="1.6" stroke-linejoin="round"/>
        <!-- Incoming ray -->
        <path d="M1 9.5L7 11.5" stroke="#ededed" stroke-width="1.4" stroke-linecap="round"/>
        <!-- 3 Refracted exit rays -->
        <path d="M14.5 11L23 9.5" stroke="#00f0ff" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M15.5 13L23 13.5" stroke="#ededed" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M16.5 15L23 17.5" stroke="#888888" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="scales">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M10 3L19 19H1L10 3Z" stroke="#ededed" stroke-width="1.6" stroke-linejoin="round"/><path d="M1 9.5L7 11.5" stroke="#ededed" stroke-width="1.4" stroke-linecap="round"/><path d="M14.5 11L23 9.5" stroke="#00f0ff" stroke-width="1.4" stroke-linecap="round"/><path d="M15.5 13L23 13.5" stroke="#ededed" stroke-width="1.4" stroke-linecap="round"/><path d="M16.5 15L23 17.5" stroke="#888888" stroke-width="1.4" stroke-linecap="round"/></svg>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M10 3L19 19H1L10 3Z" stroke="#ededed" stroke-width="1.8" stroke-linejoin="round"/><path d="M1 9.5L7 11.5" stroke="#ededed" stroke-width="1.5"/><path d="M14.5 11L23 9.5M15.5 13L23 13.5M16.5 15L23 17.5" stroke="#ededed" stroke-width="1.5"/></svg>
    </div>
  </div>

  <!-- 2. Dual Biconvex Lens -->
  <div class="card">
    <h3>2. Biconvex Optical Lens</h3>
    <p>Direction 2: Precision Focal Aperture</p>
    <div class="preview">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none">
        <path d="M12 2C5.5 7.5 5.5 16.5 12 22C18.5 16.5 18.5 7.5 12 2Z" fill="#ededed" fill-opacity="0.1" stroke="#ededed" stroke-width="1.75" stroke-linejoin="round"/>
        <circle cx="12" cy="12" r="3.2" stroke="#ededed" stroke-width="1.5"/>
        <circle cx="12" cy="12" r="1.2" fill="#00f0ff"/>
        <line x1="12" y1="2" x2="12" y2="6.5" stroke="#ededed" stroke-width="1.2"/>
        <line x1="12" y1="17.5" x2="12" y2="22" stroke="#ededed" stroke-width="1.2"/>
      </svg>
    </div>
    <div class="scales">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M12 2C5.5 7.5 5.5 16.5 12 22C18.5 16.5 18.5 7.5 12 2Z" fill="#ededed" fill-opacity="0.1" stroke="#ededed" stroke-width="1.75"/><circle cx="12" cy="12" r="3.2" stroke="#ededed" stroke-width="1.5"/><circle cx="12" cy="12" r="1.2" fill="#00f0ff"/></svg>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 2C5.5 7.5 5.5 16.5 12 22C18.5 16.5 18.5 7.5 12 2Z" stroke="#ededed" stroke-width="2"/><circle cx="12" cy="12" r="2.5" fill="#ededed"/></svg>
    </div>
  </div>

  <!-- 3. Faceted Compass Needle (45° Northeast) -->
  <div class="card">
    <h3>3. Faceted Compass Needle</h3>
    <p>Direction 3: 45° Trajectory & Heading</p>
    <div class="preview">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none">
        <!-- North facet (bright) -->
        <path d="M21 3L8.5 10.5L3 21L21 3Z" fill="#ededed"/>
        <!-- South facet (titanium shadow) -->
        <path d="M21 3L13.5 15.5L3 21L21 3Z" fill="#555555"/>
        <!-- Pivot core -->
        <circle cx="11.5" cy="12.5" r="1.8" fill="#000" stroke="#ededed" stroke-width="1"/>
      </svg>
    </div>
    <div class="scales">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M21 3L8.5 10.5L3 21L21 3Z" fill="#ededed"/><path d="M21 3L13.5 15.5L3 21L21 3Z" fill="#555555"/><circle cx="11.5" cy="12.5" r="1.8" fill="#000" stroke="#ededed" stroke-width="1"/></svg>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M21 3L8.5 10.5L3 21L21 3Z" fill="#ededed"/><path d="M21 3L13.5 15.5L3 21L21 3Z" fill="#555555"/></svg>
    </div>
  </div>

  <!-- 4. Polaris Compass Spark -->
  <div class="card">
    <h3>4. Polaris Compass Star</h3>
    <p>Direction 3: Navigational Guiding Spark</p>
    <div class="preview">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none">
        <!-- Faceted 4-point star -->
        <!-- North-West quadrant -->
        <path d="M12 2C12 7.5 7.5 12 2 12L12 12L12 2Z" fill="#ededed"/>
        <!-- South-East quadrant -->
        <path d="M12 22C12 16.5 16.5 12 22 12L12 12L12 22Z" fill="#ededed"/>
        <!-- North-East quadrant (shaded) -->
        <path d="M12 2C12 7.5 16.5 12 22 12L12 12L12 2Z" fill="#555555"/>
        <!-- South-West quadrant (shaded) -->
        <path d="M12 22C12 16.5 7.5 12 2 12L12 12L12 22Z" fill="#555555"/>
        <circle cx="12" cy="12" r="1.5" fill="#000"/>
      </svg>
    </div>
    <div class="scales">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M12 2C12 7.5 7.5 12 2 12L12 12L12 2Z" fill="#ededed"/><path d="M12 22C12 16.5 16.5 12 22 12L12 12L12 22Z" fill="#ededed"/><path d="M12 2C12 7.5 16.5 12 22 12L12 12L12 2Z" fill="#555555"/><path d="M12 22C12 16.5 7.5 12 2 12L12 12L12 22Z" fill="#555555"/><circle cx="12" cy="12" r="1.5" fill="#000"/></svg>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 2C12 7.5 7.5 12 2 12C7.5 12 12 16.5 12 22C12 16.5 16.5 12 22 12C16.5 12 12 7.5 12 2Z" fill="#ededed"/></svg>
    </div>
  </div>

</div>
</body>
</html>
