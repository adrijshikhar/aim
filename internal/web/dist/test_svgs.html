<!DOCTYPE html>
<html>
<head>
<style>
body { background: #000; color: #fff; font-family: sans-serif; display: flex; gap: 40px; padding: 40px; }
.item { display: flex; flex-direction: column; align-items: center; gap: 12px; }
</style>
</head>
<body>

<!-- C1: Optical Prism (Refraction Split) -->
<div class="item">
  <span>1. Optical Prism</span>
  <svg width="64" height="64" viewBox="0 0 24 24" fill="none">
    <path d="M12 3L21 19H3L12 3Z" stroke="#ededed" stroke-width="1.75" stroke-linejoin="round"/>
    <path d="M12 3L12 19" stroke="#ededed" stroke-width="1.2" stroke-dasharray="1 2"/>
    <path d="M7 14L17 14M8.5 16.5L15.5 16.5" stroke="#00f0ff" stroke-width="1.5" stroke-linecap="round"/>
  </svg>
</div>

<!-- C2: Biconvex Focal Lens -->
<div class="item">
  <span>2. Focal Lens</span>
  <svg width="64" height="64" viewBox="0 0 24 24" fill="none">
    <path d="M12 2C6.5 7 6.5 17 12 22C17.5 17 17.5 7 12 2Z" fill="#ededed" fill-opacity="0.15" stroke="#ededed" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="12" cy="12" r="3" fill="#ededed"/>
    <line x1="12" y1="2" x2="12" y2="22" stroke="#ededed" stroke-width="1.2" stroke-opacity="0.5"/>
  </svg>
</div>

<!-- C3: Navigational Compass Needle (45° Trajectory) -->
<div class="item">
  <span>3. Compass Needle (45°)</span>
  <svg width="64" height="64" viewBox="0 0 24 24" fill="none">
    <!-- North/Active half -->
    <path d="M21 3L9 11L13 15L21 3Z" fill="#ededed"/>
    <!-- South/Tail half -->
    <path d="M3 21L13 15L9 11L3 21Z" fill="#555555"/>
    <line x1="3" y1="21" x2="21" y2="3" stroke="#000" stroke-width="0.75"/>
  </svg>
</div>

<!-- C4: Navigational Compass (Vertical Sleek) -->
<div class="item">
  <span>4. Compass Vertical</span>
  <svg width="64" height="64" viewBox="0 0 24 24" fill="none">
    <path d="M12 2L16 11L12 10L8 11L12 2Z" fill="#ededed"/>
    <path d="M12 22L16 13L12 14L8 13L12 22Z" fill="#555555"/>
    <circle cx="12" cy="12" r="1.5" fill="#ededed"/>
  </svg>
</div>

<!-- C5: Polaris Spark / North Star -->
<div class="item">
  <span>5. Polaris Star</span>
  <svg width="64" height="64" viewBox="0 0 24 24" fill="none">
    <path d="M12 2C12 7.8 7.8 12 2 12C7.8 12 12 16.2 12 22C12 16.2 16.2 12 22 12C16.2 12 12 7.8 12 2Z" fill="#ededed"/>
    <circle cx="12" cy="12" r="1.5" fill="#000"/>
  </svg>
</div>

</body>
</html>
