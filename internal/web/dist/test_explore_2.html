<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { background: #000; color: #fff; font-family: -apple-system, sans-serif; padding: 40px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; max-width: 1200px; margin: 0 auto; }
  .card { background: #0a0a0a; border: 1px solid #222; border-radius: 8px; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
  .preview { width: 100px; height: 100px; background: #000; border: 1px solid #1a1a1a; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
  .scales { display: flex; gap: 16px; align-items: center; }
  h3 { font-size: 14px; margin: 0; color: #ededed; }
  p { font-size: 11px; color: #777; margin: 0; }
</style>
</head>
<body>
<div class="grid">

  <!-- A: The Refraction Delta (Prism A) -->
  <div class="card">
    <h3>A. Refraction Prism (Delta)</h3>
    <p>Prism splitting into 3 agent bands</p>
    <div class="preview">
      <svg width="68" height="68" viewBox="0 0 24 24" fill="none">
        <!-- Solid Prism Triangle -->
        <path d="M12 2.5L21.5 20H2.5L12 2.5Z" stroke="#ededed" stroke-width="1.6" stroke-linejoin="round"/>
        <!-- Incoming beam -->
        <line x1="2.5" y1="12" x2="8.5" y2="12" stroke="#ededed" stroke-width="1.5" stroke-linecap="round"/>
        <!-- Internal Refraction Plane -->
        <path d="M8.5 12L13 14" stroke="#ededed" stroke-width="1.5"/>
        <!-- 3 Output bands -->
        <path d="M13 12L21.5 10.5M13.5 14L21.5 14M14 16L21.5 17.5" stroke="#00f0ff" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="scales">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M12 2.5L21.5 20H2.5L12 2.5Z" stroke="#ededed" stroke-width="1.8" stroke-linejoin="round"/><line x1="2.5" y1="12" x2="8.5" y2="12" stroke="#ededed" stroke-width="1.5"/><path d="M8.5 12L13 14" stroke="#ededed" stroke-width="1.5"/><path d="M13 12L21.5 10.5M13.5 14L21.5 14M14 16L21.5 17.5" stroke="#00f0ff" stroke-width="1.4"/></svg>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 2.5L21.5 20H2.5L12 2.5Z" stroke="#ededed" stroke-width="2" stroke-linejoin="round"/><line x1="2.5" y1="12" x2="9" y2="12" stroke="#ededed" stroke-width="1.8"/><path d="M13 11L21 11M13.5 14L21 14M14 17L21 17" stroke="#ededed" stroke-width="1.5"/></svg>
    </div>
  </div>

  <!-- B: Bolder Chronometer Compass Needle (45°) -->
  <div class="card">
    <h3>B. Precision Compass Needle</h3>
    <p>45° Trajectory with Gimbal Ring</p>
    <div class="preview">
      <svg width="68" height="68" viewBox="0 0 24 24" fill="none">
        <!-- Outer Gimbal Ring (subtle) -->
        <circle cx="12" cy="12" r="9" stroke="#ededed" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="2 2"/>
        <!-- Needle Light Half -->
        <path d="M20.5 3.5L9.5 9.5L5 19L14.5 14.5L20.5 3.5Z" fill="#ededed"/>
        <!-- Needle Bevel Shadow Half -->
        <path d="M20.5 3.5L14.5 14.5L3.5 20.5L9.5 9.5L20.5 3.5Z" fill="#666666"/>
        <!-- Pivot Pin -->
        <circle cx="12" cy="12" r="1.8" fill="#00f0ff"/>
      </svg>
    </div>
    <div class="scales">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#ededed" stroke-width="1.2" stroke-opacity="0.3"/><path d="M20.5 3.5L9.5 9.5L5 19L14.5 14.5L20.5 3.5Z" fill="#ededed"/><path d="M20.5 3.5L14.5 14.5L3.5 20.5L9.5 9.5L20.5 3.5Z" fill="#666666"/><circle cx="12" cy="12" r="1.8" fill="#00f0ff"/></svg>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M20.5 3.5L9.5 9.5L5 19L14.5 14.5L20.5 3.5Z" fill="#ededed"/><path d="M20.5 3.5L14.5 14.5L3.5 20.5L9.5 9.5L20.5 3.5Z" fill="#666666"/></svg>
    </div>
  </div>

  <!-- C: Compass Rose (Oriented North) -->
  <div class="card">
    <h3>C. Navigational Compass Rose</h3>
    <p>Elongated North Point with Facets</p>
    <div class="preview">
      <svg width="68" height="68" viewBox="0 0 24 24" fill="none">
        <!-- North Facet (Tall) -->
        <path d="M12 1L12 12L9.5 12L12 1Z" fill="#ededed"/>
        <path d="M12 1L14.5 12L12 12L12 1Z" fill="#666666"/>
        <!-- South Facet -->
        <path d="M12 21L12 12L14 12L12 21Z" fill="#ededed"/>
        <path d="M12 21L10 12L12 12L12 21Z" fill="#666666"/>
        <!-- East Facet -->
        <path d="M21 12L12 12L12 9.5L21 12Z" fill="#ededed"/>
        <path d="M21 12L12 14.5L12 12L21 12Z" fill="#666666"/>
        <!-- West Facet -->
        <path d="M3 12L12 12L12 14.5L3 12Z" fill="#ededed"/>
        <path d="M3 12L12 9.5L12 12L3 12Z" fill="#666666"/>
        <!-- Center Core -->
        <circle cx="12" cy="12" r="1.5" fill="#000"/>
      </svg>
    </div>
    <div class="scales">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M12 1L12 12L9.5 12L12 1Z" fill="#ededed"/><path d="M12 1L14.5 12L12 12L12 1Z" fill="#666666"/><path d="M12 21L12 12L14 12L12 21Z" fill="#ededed"/><path d="M12 21L10 12L12 12L12 21Z" fill="#666666"/><path d="M21 12L12 12L12 9.5L21 12Z" fill="#ededed"/><path d="M21 12L12 14.5L12 12L21 12Z" fill="#666666"/><path d="M3 12L12 12L12 14.5L3 12Z" fill="#ededed"/><path d="M3 12L12 9.5L12 12L3 12Z" fill="#666666"/><circle cx="12" cy="12" r="1.5" fill="#000"/></svg>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 1L12 12L9 12L12 1Z" fill="#ededed"/><path d="M12 1L15 12L12 12L12 1Z" fill="#666666"/><path d="M12 21L12 12L14 12L12 21Z" fill="#ededed"/><path d="M12 21L10 12L12 12L12 21Z" fill="#666666"/><path d="M21 12L12 12L12 9.5L21 12Z" fill="#ededed"/><path d="M3 12L12 12L12 14.5L3 12Z" fill="#ededed"/></svg>
    </div>
  </div>

  <!-- D: The Vector Refraction (Arrow + Prism Tails) -->
  <div class="card">
    <h3>D. Refracting Vector Dart</h3>
    <p>Forward Arrow with 3 Agent Beams</p>
    <div class="preview">
      <svg width="68" height="68" viewBox="0 0 24 24" fill="none">
        <!-- Leading Arrow Head -->
        <path d="M21 3L11 9L15 13L21 3Z" fill="#ededed"/>
        <!-- 3 Refracting Tail Streamers -->
        <path d="M11 9L3 13" stroke="#00f0ff" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M13 11L4 16.5" stroke="#ededed" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M15 13L5 20" stroke="#888888" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="scales">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M21 3L11 9L15 13L21 3Z" fill="#ededed"/><path d="M11 9L3 13" stroke="#00f0ff" stroke-width="1.8" stroke-linecap="round"/><path d="M13 11L4 16.5" stroke="#ededed" stroke-width="1.8" stroke-linecap="round"/><path d="M15 13L5 20" stroke="#888888" stroke-width="1.8" stroke-linecap="round"/></svg>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M21 3L11 9L15 13L21 3Z" fill="#ededed"/><path d="M11 9L3 13M13 11L4 16.5M15 13L5 20" stroke="#ededed" stroke-width="1.6" stroke-linecap="round"/></svg>
    </div>
  </div>

</div>
</body>
</html>
